name: Learning and mastery task
description: Publish a personal task only after Prem-Tomar authorizes creation.
title: "[TASK-ID][learner] Precise title"
body:
  - type: markdown
    attributes:
      value: "Further issue creation is paused until owner authorization. Give each learner a distinct product contribution with full independent concept coverage."
  - type: textarea
    id: metadata
    attributes:
      label: Task metadata and prerequisites
      description: Distinct task ID, learner, roadmap slice/day, reviewed predecessor, closure event and prior product dependencies. W1 D7 requires D1-D6 in order.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: One primary learning idea and product goal
      description: Name one main idea and a small implementation increment in the actual product path. Split unrelated capabilities before publication.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Precise task
      description: Per-function inputs/types/defaults, exact success/error outputs, validation order, worked examples, constraints and integration point. Frontend work includes screen images and relevant states.
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: Out of scope
      description: Name adjacent features, abstractions and optimizations deferred to successors. Introduce only the boundaries this task needs.
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: Why we do this and what we achieve
    validations:
      required: true
  - type: textarea
    id: concepts
    attributes:
      label: What this teaches
      description: Explain every concept in plain language with an example. Both learners cover basics independently through different features.
    validations:
      required: true
  - type: textarea
    id: hints
    attributes:
      label: Progressive research hints
      description: Three useful search phrases, comparisons or diagnostic questions. Help investigation without dictating the architecture or supplying solution steps.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Observable implementation completion and product progress
      description: State the bounded behavior and failure/recovery criteria before work starts. A demonstration is required; formal reports and test authoring are not required deliverables. Maintainers may own routine checks.
    validations:
      required: true
  - type: textarea
    id: mastery
    attributes:
      label: Separate mastery coaching and Question of the Day
      description: Explanation, prediction, debugging, tradeoffs and unseen transfer are learning checks, not surprise product requirements. From D2 revisit earlier completed learning in the review discussion, without supplying answers. Unanswered questions do not block an otherwise correct implementation.
    validations:
      required: true
