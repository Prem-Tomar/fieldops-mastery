name: Learning and mastery task
description: Publish a personal task only after Prem-Tomar authorizes creation.
title: "[TASK-ID][learner] Precise title"
body:
  - type: markdown
    attributes:
      value: "Further issue creation is paused until owner authorization. Give each learner a distinct product contribution with full independent concept coverage."
  - type: textarea
    id: metadata
    attributes:
      label: Task metadata and prerequisites
      description: Distinct task ID, learner, roadmap week, predecessor, closure event and prior product dependencies.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Precise task
      description: Per-function inputs/types/defaults, exact success/error outputs, validation order, worked examples, constraints and integration point. Frontend work includes screen images and relevant states.
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: Why we do this and what we achieve
    validations:
      required: true
  - type: textarea
    id: concepts
    attributes:
      label: What this teaches
      description: Explain every concept in plain language with an example. Both learners cover basics independently through different features.
    validations:
      required: true
  - type: textarea
    id: hints
    attributes:
      label: Progressive hints
      description: Three hints, conceptual through diagnostic.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Observable acceptance and product progress
      description: Demonstrate integrated behavior and failure/recovery cases. Test writing is optional PR feedback; tests and documentation are not separate assignments.
    validations:
      required: true
  - type: textarea
    id: mastery
    attributes:
      label: Independent mastery challenge and coach assessment
      description: Explanation, prediction, debugging, tradeoffs, unseen transfer.
    validations:
      required: true
