name: Curriculum validation
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  curriculum-validation:
    name: curriculum-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_curriculum.py
      - run: python scripts/forecast_roadmap.py
